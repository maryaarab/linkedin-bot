name: Generate posts
on:
  schedule:
    - cron: "17 10 * * *"      # الأساسية 10:17 UTC = 11:17 بالمغرب (بعد انتهاء الاستيراد)
    - cron: "7 11 * * *"       # احتياطية 11:07 UTC (تتجاوز التوليد إن تم)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: queue
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python generate.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTS_PER_DAY: "15"
      - run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add posts.json
          git commit -m "new posts" || echo "nothing to commit"
          git pull --rebase && git push
