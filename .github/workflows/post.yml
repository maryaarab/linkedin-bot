name: Post to LinkedIn
on:
  schedule:
    # محاولات متكررة في دقائق أقل ازدحاماً؛ post.py يقرر هل ينشر أم لا
    # النافذة: 12:00-04:00 UTC = 8:00 صباحاً - 12:00 ليلاً بتوقيت نيويورك (EDT)
    - cron: "7,27,47 12-23 * * *"
    - cron: "7,27,47 0-3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: queue
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python post.py
        env:
          LI_TOKEN: ${{ secrets.LI_TOKEN }}
          LI_PERSON_ID: ${{ secrets.LI_PERSON_ID }}
          LI_ORG_ID: ${{ secrets.LI_ORG_ID }}
      - run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add posts.json
          git commit -m "posted" || echo "nothing to commit"
          git pull --rebase && git push
