name: Post to LinkedIn
on:
  schedule:
    - cron: "17 * * * *"      # احتياطي فقط؛ المشغّل الأساسي cron-job.org كل 30 دقيقة
  repository_dispatch:
    types: [post]      # استدعاء خارجي من cron-job.org
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: queue
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python post.py
        env:
          LI_TOKEN: ${{ secrets.LI_TOKEN }}
          LI_PERSON_ID: ${{ secrets.LI_PERSON_ID }}
          LI_ORG_ID: ${{ secrets.LI_ORG_ID }}
      - run: python pin_post.py
        if: always()
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          # الإعداد المجاني (حوالي 600 رصيد Make شهرياً): 10 بيبنات في النهار الأمريكي
          PIN_SLOTS: "10"
          PIN_START_H: "12"
          PIN_SPAN_H: "14"
          PIN_WINDOW_H: "16"
          # للنشر كل ساعة (24 بيناً؛ يحتاج خطة Make مدفوعة) استبدل القيم الأربع بهذه:
          # PIN_SLOTS: "24"  PIN_START_H: "11"  PIN_SPAN_H: "23"  PIN_WINDOW_H: "24"
      - if: always()
        run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "posted" || echo "nothing to commit"
          git pull --rebase && git push
